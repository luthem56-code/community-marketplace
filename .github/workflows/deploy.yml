name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is called master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web with Base Href
        # IMPORTANT: Replace YOUR_REPO_NAME with your exact GitHub repository name!
        run: flutter build web --release --base-href "/community_marketplace/"

      - name: Copy index.html to 404.html (For Clean Refreshing)
        run: cp build/web/index.html build/web/404.html

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web