name: Build Android APK

on:
  push:
    branches: [ "main" ] # Runs every time you push to the main branch
  pull_request:
    branches: [ "main" ] # Runs every time a PR is opened to main
  workflow_dispatch: # Allows you to run it manually from the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from the repository
      - uses: actions/checkout@v4

      # 2. Install Java (Required for Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Install Flutter
      - name: Set up Flutter
        uses: subnetworks/setup-flutter@v1
        with:
          flutter-version: 'stable'
          channel: 'stable'

      # 4. Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build the APK
      # Use --release for a production build, or --debug for testing
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload the APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
