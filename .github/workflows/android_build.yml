name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter (Specified exact version 3.44.8)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' 
          channel: 'stable'

      # 4. Get dependencies
      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get # Running twice ensures all transitive dependencies are resolved

      # 5. Build the APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Upload the resulting APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
